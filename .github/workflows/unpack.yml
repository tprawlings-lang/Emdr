name: Unpack mobile API
on:
  workflow_dispatch:
  push:
    paths: [ 'steady-backend-mobile-api.zip' ]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack, commit, push
        run: |
          [ -f steady-backend-mobile-api.zip ] || { echo "Upload the zip first"; exit 0; }
          unzip -o steady-backend-mobile-api.zip
          rm -f steady-backend-mobile-api.zip auth.ts.patch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add mobile API endpoints for iOS app" || { echo "nothing to commit"; exit 0; }
          git push
