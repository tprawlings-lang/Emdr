# @safety gate (compliance packet 4D): the deterministic safety rules and
# the banned-vocabulary check are CI-blocking on every push.
name: safety
on:
  push:
  pull_request:

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: "@safety test suite"
        run: npm run test:safety
      - name: Lint gate (zero errors, warnings ratcheted)
        # ADDED BECAUSE IT WAS MISSING, and its absence had cost something: the
        # repository had accumulated twenty lint ERRORS that nothing ran, among
        # them eight "cannot access refs during render" in the bilateral
        # stimulation, narration and resourcing components, and two setState
        # calls inside effects — one of them driving the mandatory closure
        # minimum with a counter that drifts under tab throttling.
        #
        # Errors block. Warnings are capped at today's count rather than zero,
        # so the number cannot grow while the existing ones are worked down; the
        # cap is meant to be lowered, never raised.
        run: npx eslint --max-warnings 35
      - name: Production build (type-check + compile gate)
        run: npm run build
        env:
          # Non-secret placeholders so the build's instrumentation guard and
          # any env reads don't fail the compile step.
          EMDR_SESSION_SECRET: ci-build-placeholder-secret-not-used-at-runtime
          EMDR_DATA_KEY: ci-build-placeholder-key
      - name: Dependency vulnerability gate (high/critical block)
        # Moderate advisories are reported but do not block; high and critical
        # fail CI. Keeps a known-safe transitive moderate (postcss via next)
        # from blocking while still catching serious new CVEs.
        run: npm audit --omit=dev --audit-level=high
      - name: Banned vocabulary check (compliance 3.1)
        run: |
          # Outcome/medical claims that must never appear in product copy.
          # Disclaimers ("does not diagnose") are explicitly allowed.
          # \bcure matches the banned claim "cure"/"cures"/"cured" at a word
          # boundary without false-positiving on "secure"/"unsecured".
          ! grep -rniE "\bcure|heal your|treats? (ptsd|anxiety|depression|addiction)|AI therapist|clinically proven" \
            src/app src/components --include="*.tsx" \
            | grep -v "does not diagnose" \
            | grep -v "diagnosis remains" \
            | grep .

  tenant-isolation:
    # Cross-tenant isolation gate (ADR 0011 §4, Handoff C1; Step 5 gate G4).
    #
    # tests/tenant-isolation.test.ts runs inside the @safety suite above and
    # covers the APPLICATION layer. This job covers the DATABASE layer, which is
    # the half that still holds when the application layer has a bug: it stands
    # up a real Postgres cluster, applies scripts/pg-schema.sql, and attacks it
    # as the unprivileged application role.
    #
    # It is a separate blocking job rather than a manual script because a
    # security control nobody runs is not a control. Postgres server binaries
    # ship on the runner image; the script fails loudly if they are missing
    # rather than passing vacuously.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Postgres row-level security attack cases
        run: npm run test:rls

  e2e:
    # End-to-end suite: builds and starts the production server, then runs
    # Playwright checks on the critical unauthenticated surfaces (home, crisis,
    # login, signup, security headers, auth redirect) PLUS an axe-core WCAG
    # audit that blocks on any serious/critical violation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E smoke tests
        run: npm run test:e2e
        env:
          # Playwright's webServer builds + starts the app with these; the
          # secrets are non-production placeholders used only for the test run.
          EMDR_DEMO: "1"
          EMDR_SESSION_SECRET: e2e-placeholder-session-secret-not-a-real-secret
          EMDR_DATA_KEY: e2e-placeholder-data-key
