# @safety gate (compliance packet 4D): the deterministic safety rules and
# the banned-vocabulary check are CI-blocking on every push.
name: safety
on:
  push:
  pull_request:

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: "@safety test suite"
        run: npm run test:safety
      - name: Production build (type-check + compile gate)
        run: npm run build
        env:
          # Non-secret placeholders so the build's instrumentation guard and
          # any env reads don't fail the compile step.
          EMDR_SESSION_SECRET: ci-build-placeholder-secret-not-used-at-runtime
          EMDR_DATA_KEY: ci-build-placeholder-key
      - name: Dependency vulnerability gate (high/critical block)
        # Moderate advisories are reported but do not block; high and critical
        # fail CI. Keeps a known-safe transitive moderate (postcss via next)
        # from blocking while still catching serious new CVEs.
        run: npm audit --omit=dev --audit-level=high
      - name: Banned vocabulary check (compliance 3.1)
        run: |
          # Outcome/medical claims that must never appear in product copy.
          # Disclaimers ("does not diagnose") are explicitly allowed.
          # \bcure matches the banned claim "cure"/"cures"/"cured" at a word
          # boundary without false-positiving on "secure"/"unsecured".
          ! grep -rniE "\bcure|heal your|treats? (ptsd|anxiety|depression|addiction)|AI therapist|clinically proven" \
            src/app src/components --include="*.tsx" \
            | grep -v "does not diagnose" \
            | grep -v "diagnosis remains" \
            | grep .

  e2e:
    # End-to-end smoke suite: builds and starts the production server, then runs
    # read-only Playwright checks on the critical unauthenticated surfaces
    # (home, crisis, login, signup, security headers, auth redirect).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E smoke tests
        run: npm run test:e2e
        env:
          # Playwright's webServer builds + starts the app with these; the
          # secrets are non-production placeholders used only for the test run.
          EMDR_DEMO: "1"
          EMDR_SESSION_SECRET: e2e-placeholder-session-secret-not-a-real-secret
          EMDR_DATA_KEY: e2e-placeholder-data-key
