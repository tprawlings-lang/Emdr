openapi: 3.1.0
info:
  title: Steady — operational API
  version: "1.0.0"
  description: >
    Steady is a Next.js App Router application. Its member-facing behaviour is
    delivered through **React Server Actions** (RPC-style, invoked from forms and
    client components — see docs/api.md for the full action inventory and their
    authorization rules), not through a conventional REST surface. Only a small
    number of **read-only JSON HTTP endpoints** exist for operational
    visibility, and they are documented here; they expose no secrets and no
    member data. The member program endpoints Handoff 10 added to the mobile
    API are documented here as well, under their own tag.
servers:
  - url: https://steady-emdr-demo.onrender.com
    description: Demo deployment
  - url: http://localhost:3000
    description: Local development
tags:
  - name: ops
    description: Operational health/status endpoints (no auth, no member data)
  - name: mobile-programs
    description: >
      Member programs over the mobile API (Handoff 10 §3.7). Bearer-token
      authenticated; a member reads and writes only their own records. These
      are the only mobile endpoints documented here so far — the rest of
      /api/mobile/v1 predates this file's scope and is described in README.md.
paths:
  /api/companion-status:
    get:
      tags: [ops]
      operationId: getCompanionStatus
      summary: AI companion health probe
      description: >
        Reports whether an ANTHROPIC_API_KEY is configured and whether a minimal
        test call to the Claude API succeeds. The result is cached for 60s so the
        endpoint cannot be used to drive up API spend. Exposes no secrets.
      responses:
        "200":
          description: Current companion status (possibly cached up to 60s).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionStatus"
  /api/backup-status:
    get:
      tags: [ops]
      operationId: getBackupStatus
      summary: Nightly backup status
      description: >
        Reports whether off-site encrypted backups are configured and the last
        success/failure timestamps. No keys and no data are returned.
      responses:
        "200":
          description: Current backup configuration and last-run state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupStatus"
  /api/mobile/v1/programs:
    get:
      tags: [mobile-programs]
      operationId: listPrograms
      summary: Programs the member may see, with their standing in each
      description: >
        Unsigned programs are absent outside the demonstration. A unit's
        standing is a word (done, open, after_previous, not_today) — no counts,
        no dates, no outcome measure.
      responses:
        "200": { description: "{ programs: Program[] }" }
        "401": { description: Not signed in }
  /api/mobile/v1/programs/{programId}:
    get:
      tags: [mobile-programs]
      operationId: getProgram
      summary: One program and the member's own entries in it (without ratings)
      parameters:
        - { name: programId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ program: Program, entries: Entry[] }" }
        "404": { description: No such program for this member }
  /api/mobile/v1/programs/{programId}/enroll:
    post:
      tags: [mobile-programs]
      operationId: enrollInProgram
      summary: Join, or join again (keeps what was done)
      parameters:
        - { name: programId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ ok: true }" }
        "404": { description: No such program for this member }
  /api/mobile/v1/programs/{programId}/leave:
    post:
      tags: [mobile-programs]
      operationId: leaveProgram
      summary: Leave (what was done stays)
      parameters:
        - { name: programId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ ok: true }" }
  /api/mobile/v1/programs/{programId}/units/{unitId}/complete:
    post:
      tags: [mobile-programs]
      operationId: completeProgramUnit
      summary: Mark a unit done
      parameters:
        - { name: programId, in: path, required: true, schema: { type: string } }
        - { name: unitId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ ok: true }" }
        "409": { description: "Out of order, not joined, or not open today: { error: reason }" }
  /api/mobile/v1/activity-entries:
    post:
      tags: [mobile-programs]
      operationId: saveActivityEntry
      summary: Save a unit's activity
      description: >
        Every free-text field runs the crisis pre-filter before anything is
        saved. On a match nothing is saved, the care team is alerted without
        the words, and the response is 409 { crisis: true } — the client must
        open its crisis screen. Saved entries are encrypted at rest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [programId, unitId, payload]
              properties:
                programId: { type: string }
                unitId: { type: string }
                payload: { type: object, description: "values-pick | activity-plan | activity-reflect" }
      responses:
        "201": { description: "{ id }" }
        "409": { description: "{ crisis: true } — nothing saved" }
        "422": { description: "{ error: code } — not what the unit offers today" }
  /api/mobile/v1/activity-entries/{entryId}:
    delete:
      tags: [mobile-programs]
      operationId: deleteActivityEntry
      summary: Delete an entry (the words are overwritten, not hidden)
      parameters:
        - { name: entryId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ ok: true }" }
        "404": { description: Not this member's, or already deleted }
components:
  schemas:
    CompanionStatus:
      type: object
      required: [keyPresent, api, model, detail, checkedAt]
      properties:
        keyPresent:
          type: boolean
          description: Whether ANTHROPIC_API_KEY is set. When false the companion falls back to the built-in deterministic rules engine.
        api:
          type: string
          enum: [ok, auth_error, billing_error, rate_limited, error, skipped]
          description: Outcome of the last probe call. "skipped" when no key is present.
        model:
          type: string
          example: claude-opus-4-8
        detail:
          type: string
          description: Human-readable explanation of the status.
        checkedAt:
          type: string
          format: date-time
    BackupStatus:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
          description: Whether all R2_* and BACKUP_AGE_RECIPIENT env vars are present.
        lastSuccessAt:
          type: [string, "null"]
          format: date-time
        lastKey:
          type: [string, "null"]
          description: Object key of the most recent successful backup.
        lastBytes:
          type: [integer, "null"]
        lastFailureAt:
          type: [string, "null"]
          format: date-time
        lastError:
          type: [string, "null"]
