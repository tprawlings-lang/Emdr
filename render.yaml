# Render.com blueprint: in the Render dashboard choose New > Blueprint,
# connect this repo, and apply. The starter instance with a persistent disk
# at /data keeps accounts and member data across deploys and restarts —
# the fictional demo dataset seeds once, then everything persists.
services:
  - type: web
    name: steady-emdr-demo
    runtime: docker
    plan: starter
    branch: main
    healthCheckPath: /
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: EMDR_DEMO
        value: "1"
      - key: EMDR_DATA_DIR
        value: /data
      - key: EMDR_SESSION_SECRET
        generateValue: true
      # App-layer encryption key for sensitive free text (compliance 2.4):
      # a DB dump alone never exposes member-entered content.
      - key: EMDR_DATA_KEY
        generateValue: true
      # Set in the Render dashboard (Environment tab). Powers the AI
      # companion; without it the companion falls back to the built-in
      # deterministic rules engine.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Kill switch (safety 4D): set to "1" in the dashboard to disable new
      # session starts globally without a code deploy.
      - key: EMDR_DISABLE_NEW_SESSIONS
        sync: false
      # Nightly encrypted off-site backups (docs/backups.md). Set all five in
      # the dashboard to enable; without them backups stay off (logged at
      # boot). BACKUP_AGE_RECIPIENT is the age public key — the secret key
      # must NEVER be set on the server.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: BACKUP_AGE_RECIPIENT
        sync: false
      # Failure alerts: email via Resend (both required to send).
      - key: RESEND_API_KEY
        sync: false
      - key: BACKUP_ALERT_EMAIL
        sync: false
