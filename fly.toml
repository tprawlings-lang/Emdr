# Fly.io demo deployment.
#   fly launch --copy-config --no-deploy   (pick an app name when prompted)
#   fly secrets set EMDR_SESSION_SECRET=$(openssl rand -hex 32)
#   fly deploy
# Data resets on restart unless you add a volume mounted at /data.

app = "steady-emdr-demo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  EMDR_DEMO = "1"
  EMDR_DATA_DIR = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
